    <script type="module">
      import { SHEET_ID, FINAL_BRACKETS_TAB_ID } from './assets/js/consts.js';

      // define the “steps” you want to zoom to (in the SVG’s own coordinate system)
      // adjust these x,y,width,height values by eyeballing the viewBox
      const views = [
        // full bracket
        { x: 40, y: 105, w: 1112, h: 630 },
      ];

      let idx = 0;
      const svg = document.querySelector('#bracket');

      function zoomTo({ x, y, w, h }) {
        gsap.to(svg, {
          attr: { viewBox: `${x} ${y} ${w} ${h}` },
          duration: 0.8,
          ease: 'power2.inOut',
        });
      }
      // Start in “full” view
      zoomTo(views[0]);

      function removeWinner(matchNumber) {
        document.getElementById(`match${matchNumber}-top`).parentElement.classList.remove('winner');
        document
          .getElementById(`match${matchNumber}-bottom`)
          .parentElement.classList.remove('winner');
      }

      function render(data) {
        for (let row of data) {
          // match 15 may or may not happen, hide unless needed
          if (row.match_number == '15') {
            if (!row.player_1 && !row.player_2) {
              document.getElementById('match15').style.display = 'none';
              document.getElementById('match15-bracket-line').style.display = 'none';
            } else {
              document.getElementById('match15').style.display = 'block';
              document.getElementById('match15-bracket-line').style.display = 'block';
            }
          }

          const winnerEl = document.getElementById(`match${row.match_number}-border`);
          if (row.active === 'TRUE') {
            winnerEl.classList.add('active');
          } else {
            winnerEl.classList.remove('active');
          }
          if (row && row.match_number && !row.player_1 && !row.player_2) {
            // reset
            document.getElementById(`match${row.match_number}-top`).textContent = '';
            document.getElementById(`match${row.match_number}-bottom`).textContent = '';
            document.getElementById(`match${row.match_number}-score-top`).textContent = '';
            document.getElementById(`match${row.match_number}-score-bottom`).textContent = '';
            removeWinner(row.match_number);
            continue;
          }

          if (row && row.match_number && (row.player_1 || row.player_2)) {
            document.getElementById(`match${row.match_number}-top`).textContent =
              row.player_1.trim();
            document.getElementById(`match${row.match_number}-bottom`).textContent =
              row.player_2.trim();

            let p1_score = row.player_1_score.trim();
            let p2_score = row.player_2_score.trim();
            if (p1_score === '' || p2_score === '') {
              document.getElementById(`match${row.match_number}-score-top`).textContent = '';
              document.getElementById(`match${row.match_number}-score-bottom`).textContent = '';
              removeWinner(row.match_number);
              continue;
            }

            p1_score = Number(row.player_1_score.trim() || 0);
            p2_score = Number(row.player_2_score.trim() || 0);

            // debugger;
            if (p1_score === 2 || p2_score === 2) {
              removeWinner(row.match_number);
              const winnerPosition = p1_score > p2_score ? 'top' : 'bottom';
              const winnerEl = document.getElementById(
                `match${row.match_number}-${winnerPosition}`,
              );
              const parent = winnerEl.parentElement;
              parent.classList.add('winner');
            } else {
              removeWinner(row.match_number);
            }
            document.getElementById(`match${row.match_number}-score-top`).textContent = p1_score;
            document.getElementById(`match${row.match_number}-score-bottom`).textContent = p2_score;
          }
        }
      }

      // for use in the iframe "mini" view
      let bracketsData;

      function fetchData() {
        const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${FINAL_BRACKETS_TAB_ID}`;

        fetch(csvUrl)
          .then((res) => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.text();
          })
          .then((txt) => {
            const { data } = Papa.parse(txt, {
              header: true,
              skipEmptyLines: true,
            });
            render(data);
            // for use in the iframe "mini" view
            bracketsData = data;
          })
          .catch((err) => {
            console.error('Fetch/Parse error:', err);
            // document.getElementById('error').innerHTML = '<p>Error loading data.</p>';
          });
      }

      window.addEventListener('DOMContentLoaded', () => {
        fetchData();
        setInterval(fetchData, 5 * 1000);
      });

      /**
       * Cases where this page is rendered as an iframe
       */
      // apply a special class if the path contains ?variant=mini for when this is rendered as an
      // iframe
      const q = new URLSearchParams(location.search);
      const isMini = q.has('mini') || q.get('variant') === 'mini';
      if (isMini) {
        document.documentElement.classList.add('mini');
        zoomTo({ x: 80, y: 125, w: 950, h: 605 });
      }
    </script>
