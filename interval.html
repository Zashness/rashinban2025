<!doctype html>
<!-- Interview: show last match & interviewee's name -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Interval</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/sponsors.css" />
    <link rel="stylesheet" href="assets/interval.css" />
    <link rel="modulepreload" href="assets/js/consts.js" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abel&family=Akshar:wght@300..700&family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://use.typekit.net/ljs6bhu.css" />
    <!-- kaneda-gothic -->
    <!-- Parses csv to JSON -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  </head>
  <body>
    <div class="bg"></div>
    <div class="container">
      <img src="assets/images/icon.svg" id="icon" />
      <div class="topbar"></div>
      <h1 class="title">ONLINE QUALIFIER</h1>
      <div class="info">
        <div id="info" class="enabled">
          <h2 class="coming-up">COMING UP</h2>
          <div class="bar"></div>
          <div id="next-match"></div>
        </div>

        <div id="countdown"></div>
      </div>

      <div class="slideshow">
        <img src="assets/slides/metas/1.png" class="slide visible" id="slide1" />
        <img src="assets/slides/metas/2.png" class="slide" id="slide2" />
        <!-- Brackets slide -->
        <div class="slide" id="slide-brackets">
          <div class="frame-wrapper">
            <iframe
              id="bracketsFrame"
              src=""
              loading="lazy"
              class="frame-viewport"
              sandbox="allow-scripts allow-same-origin"
            ></iframe>
          </div>
        </div>
      </div>

      <div id="error"></div>
      <div class="bottombar"></div>

      <div class="sponsor" id="sponsors"></div>
    </div>

    <script type="module">
      import { SHEET_ID, OVERLAYS_TAB_ID } from './assets/js/consts.js';
      import { initSponsors } from './assets/js/sponsors.js';

      const BRACKETS_QUALIFIERS_URL = 'brackets.html?variant=mini';
      const BRACKETS_FINALS_URL = 'brackets-finals.html?variant=mini';
      // settings for the `with_brackets` column in the spreadsheet
      const BRACKETS_NONE = '--No brackets--';
      const BRACKETS_QUALIFIERS = '--Qualifiers--';
      const BRACKETS_FINALS = '--Finals--';

      const logos = [
        { src: 'assets/logos/spicescode-white.svg', class: 'logo-spicescode' },
        { src: 'assets/logos/geoguessr-m.svg', class: 'logo-geoguessr' },
        { src: 'assets/logos/geoguessr-record.svg', class: 'logo-geoguessr-record' },
        { src: 'assets/logos/AltoIP-logo-white.png', class: 'logo-alto' },
        { src: 'assets/logos/birdhouse.svg', class: 'logo-birdhouse' },
      ];

      initSponsors({
        containerId: 'sponsors',
        rightLogos: logos,
        bottom: 128,
        height: 64,
        gap: 44,
        left: 765.57,
        width: 1014,
      });

      let papaData;

      /** Finds the first row where `next` column is TRUE */
      function getNextMatchRow(data) {
        for (let row of data) {
          if (row.active === 'TRUE') {
            return row;
          }
        }

        return null;
      }

      function getTimeToNextEvent(hoursStr, minsStr) {
        const h = parseInt(hoursStr, 10);
        const m = parseInt(minsStr, 10);

        const nowLocal = new Date();
        // don't know where the running instance is, so convert to utc
        const utcMs = nowLocal.getTime() + nowLocal.getTimezoneOffset() * 60_000;
        // convert now into JST
        const nowJst = new Date(utcMs + 9 * 60 * 60_000);

        // build a Date for today’s event time in JST
        let eventJst = new Date(
          nowJst.getFullYear(),
          nowJst.getMonth(),
          nowJst.getDate(),
          h,
          m,
          0,
          0,
        );

        // if the event passed in the last 10 minutes, just show 0
        // we do this to prevent seeing 23:59 when the countdown reaches 0
        // beyond that, we roll it to tomorrow
        if (eventJst.getTime() <= nowJst.getTime()) {
          if (nowJst.getTime() - eventJst.getTime() < 30 * 60 * 1000) {
            return '00:00';
          }
          eventJst.setDate(eventJst.getDate() + 1);
        }

        const diffMs = eventJst - nowJst;
        const totalSec = Math.floor(diffMs / 1000);
        const hoursLeft = Math.floor((totalSec / 3600) % 24);
        const minsLeft = Math.floor((totalSec / 60) % 60);
        const secsLeft = Math.floor(totalSec % 60);

        // format, pad single digits to always 2 digits "5" -> "05", and clamp any negative to 0
        const hh = hoursLeft > 0 ? String(Math.max(hoursLeft, 0)) : '';
        const hhSeparator = hoursLeft > 0 ? ':' : '';
        const mm = String(Math.max(minsLeft, 0)).padStart(2, '0');
        const ss = String(Math.max(secsLeft, 0)).padStart(2, '0');

        return `${hh}${hhSeparator}${mm}:${ss}`;
      }

      function isAlphaNumeric(str) {
        let code, i, len;

        for (i = 0, len = str.length; i < len; i++) {
          code = str.charCodeAt(i);
          if (
            !(code > 47 && code < 58) && // numeric (0-9)
            !(code > 64 && code < 91) && // upper alpha (A-Z)
            !(code > 96 && code < 123)
          ) {
            // lower alpha (a-z)
            return false;
          }
        }
        return true;
      }

      const SPONSORS = [
        'sponsors/1-1.png',
        'sponsors/1-2.png',
        'sponsors/1-3.png',
        'sponsors/1-4.png',
        'sponsors/2-1.png',
        'sponsors/2-2.png',
        'sponsors/2-3.png',
        'sponsors/3-1.png',
        'sponsors/3-2.png',
      ];

      const TERMS = [
        'terms/1.png',
        'terms/2.png',
        'terms/3.png',
        'terms/4.png',
        'terms/5.png',
        'terms/6.png',
        'terms/7.png',
        'terms/8.png',
        'terms/9.png',
        'terms/10.png',
        'terms/11.png',
        'terms/12.png',
      ];

      const METAS = [
        'metas/1.png',
        'metas/2.png',
        'metas/3.png',
        'metas/4.png',
        'metas/5.png',
        'metas/6.png',
        'metas/7.png',
        'metas/8.png',
        'metas/9.png',
        'metas/10.png',
        'metas/11.png',
        'metas/12.png',
        'metas/13.png',
        'metas/14.png',
        'metas/15.png',
        'metas/16.png',
        'metas/17.png',
        'metas/18.png',
        'metas/19.png',
        'metas/20.png',
        'metas/21.png',
        'metas/22.png',
        'metas/23.png',
        'metas/24.png',
        'metas/25.png',
        'metas/26.png',
        'metas/27.png',
        'metas/28.png',
        'metas/29.png',
        'metas/30.png',
        'metas/31.png',
        'metas/32.png',
        'metas/33.png',
        'metas/34.png',
        'metas/35.png',
        'metas/36.png',
        'metas/37.png',
        'metas/38.png',
        'metas/39.png',
        'metas/40.png',
        'metas/41.png',
        'metas/42.png',
        'metas/43.png',
        'metas/44.png',
        'metas/45.png',
        'metas/46.png',
        'metas/47.png',
        'metas/48.png',
        'metas/49.png',
        'metas/50.png',
        'metas/51.png',
        'metas/52.png',
        'metas/53.png',
        'metas/54.png',
        'metas/55.png',
        'metas/56.png',
        'metas/57.png',
        'metas/58.png',
        'metas/59.png',
        'metas/60.png',
        'metas/61.png',
        'metas/62.png',
        'metas/63.png',
        'metas/64.png',
        'metas/65.png',
      ];

      const slideEls = [document.getElementById('slide1'), document.getElementById('slide2')];
      let currentSlideIndex = 0; // index in FILES
      let topLayer = 0; // which of slideEls is currently visible
      const SHUFFLED_TERMS = TERMS.map((x) => {
        return { value: x, key: Math.random() };
      })
        .sort((a, b) => a.key - b.key)
        .map((x) => x.value);
      const SHUFFLED_METAS = METAS.map((x) => {
        return { value: x, key: Math.random() };
      })
        .sort((a, b) => a.key - b.key)
        .map((x) => x.value);

      const bracketSlide = document.getElementById('slide-brackets');
      const bracketIframe = document.getElementById('bracketsFrame');

      // tracks the current brackets variant across slideshow renders
      let bracketsVariant = BRACKETS_NONE;
      function slideshow() {
        // Initialize files array. Initialize in each call to `slideshow()` to prevent adding brackets multiple times.
        const files = SPONSORS.concat(SHUFFLED_TERMS).concat(SHUFFLED_METAS);
        // mix in brackets into slides when specified
        const newBracketsVariant = papaData?.[0]?.with_brackets;
        if (newBracketsVariant === BRACKETS_QUALIFIERS || newBracketsVariant === BRACKETS_FINALS) {
          // update which brackets variant is being used if it has changed since last render
          if (newBracketsVariant !== bracketsVariant) {
            bracketsVariant = newBracketsVariant;
            if (bracketsVariant === BRACKETS_QUALIFIERS) {
              bracketIframe.src = BRACKETS_QUALIFIERS_URL;
            } else if (bracketsVariant === BRACKETS_FINALS) {
              bracketIframe.src = BRACKETS_FINALS_URL;
            }
          }

          // insert a brackets “slide” every N slides
          const bracketsFrequency = Number(papaData?.[0]?.brackets_frequency) || 6;
          const BRACKETS_TOKEN = '__BRACKETS__';

          for (let i = bracketsFrequency; i < files.length; i += bracketsFrequency + 1) {
            files.splice(i, 0, BRACKETS_TOKEN);
          }
        }

        // brackets branch
        if (files[currentSlideIndex] === '__BRACKETS__') {
          // show iframe slide
          bracketSlide.classList.add('visible');
          bracketIframe.contentWindow.postMessage({ type: 'START' }, location.origin);

          // hide image layers
          slideEls[0].classList.remove('visible');
          slideEls[1].classList.remove('visible');

          // after 15s, hide iframe and continue to next item
          const BRACKETS_DURATION = 15_000;
          setTimeout(() => {
            currentSlideIndex = (currentSlideIndex + 1) % files.length;
            // slight delay to match fade timing
            setTimeout(() => {
              bracketSlide.classList.remove('visible');
              // resets brackets for next time
              bracketIframe.contentWindow.postMessage({ type: 'END' }, location.origin);
            }, 160);
            slideshow();
          }, BRACKETS_DURATION);
          return;
        }

        const duration = 10000;
        const fadeOut = slideEls[topLayer];
        const fadeIn = slideEls[1 - topLayer];

        // preload next image underneath
        fadeIn.src = `assets/slides/${files[currentSlideIndex]}`;

        function fadeout() {
          // trigger fade via CSS
          fadeIn.classList.add('visible');
          fadeOut.classList.remove('visible');

          // advance pointers
          currentSlideIndex = (currentSlideIndex + 1) % files.length;
          topLayer = (topLayer + 1) % 2;

          setTimeout(slideshow, duration);
        }
        setTimeout(fadeout, 160);
      }

      function render() {
        renderCountdown();
        renderTitle();
      }

      function renderTitle() {
        if (!papaData) {
          return;
        }
        const data = papaData;
        const titleEl = document.querySelector('.title');
        if (papaData?.[0]?.is_interval === 'TRUE') {
          titleEl.textContent = 'INTERVAL';
        } else {
          titleEl.textContent = 'ONLINE QUALIFIER';
        }
      }

      function renderCountdown() {
        if (!papaData) {
          return;
        }
        const data = papaData;

        const hh = data[0].next_event_hh || 0;
        const mm = data[0].next_event_mm || 0;
        const remaining = getTimeToNextEvent(hh, mm);
        document.getElementById('countdown').textContent = remaining;
        const infoBox = document.getElementById('info');

        const row = getNextMatchRow(data);
        if (
          !row ||
          !row.player_1 || // Ensure player_1 name and optional handle
          !row.player_2 // Ensure player_2 name and optional handle
        ) {
          infoBox.setAttribute('class', 'disabled');
          return;
        }
        infoBox.setAttribute('class', 'enabled');

        const playerOne = row.player_1.split('|');
        const playerTwo = row.player_2.split('|');

        // Player 1: `player_1` column in spreadsheet.
        const playerOneName = playerOne[0].trim() || '';

        // Player 2: `player_2` column in spreadsheet.
        const playerTwoName = playerTwo[0].trim() || '';

        const p1Az = isAlphaNumeric(playerOneName);
        const p2Az = isAlphaNumeric(playerTwoName);
        const p1Class = p1Az ? 'name-kaneda' : 'name-noto';
        const p2Class = p2Az ? 'name-kaneda' : 'name-noto';

        document.getElementById('next-match').innerHTML = `
              <p class="game-name">
                <span class="${p1Class}">${playerOneName}</span>
                <span class="versus" style="margin-right:${p2Az ? '18px' : '12px'};">VS</span>
                <span class="${p2Class}">${playerTwoName}</span>
              </p>
            `;
      }

      function fetchData() {
        const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${OVERLAYS_TAB_ID}`;

        fetch(csvUrl)
          .then((res) => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.text();
          })
          .then((txt) => {
            const { data } = Papa.parse(txt, {
              header: true,
              skipEmptyLines: true,
            });
            papaData = data;
          })
          .catch((err) => {
            console.error('Fetch/Parse error:', err);
            // document.getElementById('error').innerHTML = '<p>Error loading data.</p>';
          });
      }

      window.addEventListener('DOMContentLoaded', () => {
        fetchData();
        setInterval(fetchData, 10_000); // Six times a minute
        setInterval(render, 1_000);
        slideshow();
      });
    </script>
  </body>
</html>
