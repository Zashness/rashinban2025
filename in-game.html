<!DOCTYPE html>
<!-- In Game: overlays for pre-game/in-game/post-game in Game Master Mode -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Overlay X</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/in-game.css" />
    <link rel="modulepreload" href="assets/js/consts.js" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Abel&family=Akshar:wght@300..700&family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://use.typekit.net/ljs6bhu.css" />
    <!-- kaneda-gothic -->
    <!-- Parses csv to JSON -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  </head>
  <body>
    <div class="topbar">
      <div class="player1-bg player-bg">
        <div id="player1-handle" class="player-handle player1-handle"></div>
        <div id="player1" class="player player1"></div>
      </div>
      <div class="score-bg score1-bg">
        <div id="score1" class="score score1"></div>
      </div>
      <div class="center">
        <div class="round">ROUND</div>
        <div class="game-mode">GAME MODE</div>
        <div class="damage">DAMAGE</div>
      </div>
      <div class="score-bg score2-bg">
        <div id="score2" class="score score2"></div>
      </div>
      <div class="player2-bg player-bg">
        <div id="player2" class="player player2"></div>
        <div id="player2-handle" class="player-handle player2-handle"></div>
      </div>
    </div>

    <div id="error"></div>

    <script type="module">
      import { SHEET_ID, OVERLAYS_TAB_ID } from './assets/js/consts.js';
      /** Finds the first row where `active` column is TRUE */
      function getActiveRow(data) {
        for (let row of data) {
          if (row.active === 'TRUE') {
            return row;
          }
        }
      }

      function containsJapanese(text) {
        // "\p{Script=Han}" covers all CJK
        const japaneseRE = /[\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Han}]/u;
        return japaneseRE.test(text);
      }

      function applyKanaFont(playerName, node) {
        if (containsJapanese(playerName)) {
          node.classList.add('kana');
        } else {
          node.classList.remove('kana');
        }
      }

      function render(data) {
        // debugger;
        const row = getActiveRow(data);
        if (!row || !row.player_1 || !row.player_2) {
          return;
        }

        const playerOne = row.player_1.split('|');
        const playerTwo = row.player_2.split('|');

        // Player 1
        const playerOneNode = document.getElementById('player1');
        const playerOneName = playerOne[0].trim() || '';
        playerOneNode.innerHTML = playerOneName;
        applyKanaFont(playerOneName, playerOneNode);
        if (playerOne[1].trim()) {
          document.getElementById('player1-handle').innerHTML = '@' + playerOne[1].trim() || '';
        }
        document.getElementById('score1').innerHTML = row.player_1_score.trim() || '0';

        // Player 2
        const playerTwoNode = document.getElementById('player2');
        const playerTwoName = playerTwo[0].trim() || '';
        playerTwoNode.innerHTML = playerTwoName;
        applyKanaFont(playerTwoName, playerTwoNode);
        if (playerTwo[1].trim()) {
          document.getElementById('player2-handle').innerHTML = '@' + playerTwo[1].trim() || '';
        }
        document.getElementById('score2').innerHTML = row.player_2_score.trim() || '0';
      }

      function fetchData() {
        const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${OVERLAYS_TAB_ID}`;

        fetch(csvUrl)
          .then((res) => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.text();
          })
          .then((txt) => {
            const { data } = Papa.parse(txt, { header: true, skipEmptyLines: true });
            render(data);
          })
          .catch((err) => {
            console.error('Fetch/Parse error:', err);
            // document.getElementById('error').innerHTML = '<p>Error loading data.</p>';
          });
      }

      window.addEventListener('DOMContentLoaded', () => {
        fetchData();
        setInterval(fetchData, 5 * 1000);
      });
    </script>
  </body>
</html>
