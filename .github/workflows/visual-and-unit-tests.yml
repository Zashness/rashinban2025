name: visual-and-unit-tests

on:
  push: # run on push to any branch
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }} # cancel older runs on same branch
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run unit tests (Vitest)
        run: npx vitest run --coverage=false --pool forks --reporter verbose

      - name: Install Playwright (Windows browsers)
        run: npx playwright install

      - name: Start static server
        shell: bash
        run: npm run serve &

      - name: Wait for server
        run: npx --yes wait-on http://127.0.0.1:4173

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/**/*.zip
          retention-days: 7
