name: visual-tests

on:
  push: # run on push to any branch
  workflow_dispatch:

concurrency:
  group: visual-${{ github.ref }} # cancel older runs on same branch
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.47.2-jammy
      options: --ipc=host

    timeout-minutes: 10
    env:
      TZ: America/New_York
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Start static server
        run: npm run serve &

      - name: Wait for server
        run: npx --yes wait-on http://127.0.0.1:4173

      - name: Run Playwright tests (non-blocking)
        run: npx playwright test
        continue-on-error: true

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-artifacts
          path: |
            test-results/**/*.{png,webp,zip,txt,log}
            tests/**/*-snapshots/**/*.png
            playwright-report
          retention-days: 14
