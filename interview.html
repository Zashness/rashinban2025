<!DOCTYPE html>
<!-- Interview: show last match & interviewee's name -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Overlay X</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/sponsors.css" />
    <link rel="stylesheet" href="assets/player-score-topbar.css" />
    <link rel="stylesheet" href="assets/interview.css" />
    <link rel="modulepreload" href="assets/js/consts.js" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- kaneda-gothic -->
    <link rel="stylesheet" href="https://use.typekit.net/ljs6bhu.css" />
    <!-- Parses csv to JSON -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
      const SHOW_LOGO = '--Logo表示--';
    </script>
  </head>
  <body>
    <div class="topbar" id="last-match">
      <div class="player1-bg player-bg">
        <div id="player1-handle" class="player-handle player1-handle"></div>
        <div id="player1" class="player player1"></div>
      </div>
      <div class="score-bg score1-bg">
        <div id="score1" class="score score1"></div>
      </div>
      <div class="score-bg score2-bg">
        <div id="score2" class="score score2"></div>
      </div>
      <div class="player2-bg player-bg">
        <div id="player2" class="player player2"></div>
        <div id="player2-handle" class="player-handle player2-handle"></div>
      </div>
    </div>

    <div class="desk-bar">
      <div id="interview">
        <img src="assets/images/phone.svg" />
        <div class="interview-label">PLAYER INTERVIEWS ...</div>
        <div class="interviewee-wrapper">
          <div id="interviewee">しいな</div>
        </div>
      </div>
    </div>

    <div class="sponsors" id="sponsors"></div>

    <div id="error"></div>

    <script type="module">
      import { SHEET_ID, OVERLAYS_TAB_ID } from './assets/js/consts.js';
      import { renderNameAndScoreFromRow } from './assets/js/player-name-score.js';
      import { applyKanaFont, containsJapanese, getActiveRow } from './assets/js/utils.js';
      import { initSponsors } from './assets/js/sponsors.js';

      const LOGO_NODE = document.getElementById('sponsors');
      const LAST_MATCH_NODE = document.getElementById('last-match');
      const INTERVIEW_NODE = document.getElementById('interview');

      initSponsors({});

      /**
       * Sets 'visible' class for passed in element and hides the other element.
       */
      function showNode(nodeToShow) {
        const nodes = new Set([LOGO_NODE, INTERVIEW_NODE]);
        nodes.delete(nodeToShow);
        nodes.forEach((node) => {
          node.classList.remove('visible');
        });

        nodeToShow.classList.add('visible');
      }

      function showLastMatch(data) {
        const row = getActiveRow(data);
        renderNameAndScoreFromRow(row);

        LAST_MATCH_NODE.classList.add('visible');
      }

      function hideLastMatch() {
        LAST_MATCH_NODE.classList.remove('visible');
      }

      function showLogo() {
        showNode(LOGO_NODE);
      }

      function showInterview(data) {
        const playerName = data[0].desk_view;
        const playerNameNode = document.getElementById('interviewee');
        playerNameNode.innerText = playerName;

        // apply different font size for Japanese names
        applyKanaFont(playerName, playerNameNode);

        showNode(INTERVIEW_NODE);
      }

      function render(data) {
        // Controlled by `show_last_match` column in spreadsheet.
        if (data[0].show_last_match === 'TRUE') {
          showLastMatch(data);
        } else {
          hideLastMatch();
        }

        // Controlled by `desk_view` column in spreadsheet.
        if (data[0].desk_view === SHOW_LOGO) {
          showLogo();
        } else if (!!data[0].desk_view) {
          showInterview(data);
        }
      }

      function fetchData() {
        const csvUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${OVERLAYS_TAB_ID}`;

        fetch(csvUrl)
          .then((res) => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.text();
          })
          .then((txt) => {
            const { data } = Papa.parse(txt, {
              header: true,
              skipEmptyLines: true,
            });
            render(data);
          })
          .catch((err) => {
            console.error('Fetch/Parse error:', err);
            // document.getElementById('error').innerHTML = '<p>Error loading data.</p>';
          });
      }

      window.addEventListener('DOMContentLoaded', () => {
        fetchData();
        setInterval(fetchData, 2 * 1000);
      });
    </script>
  </body>
</html>
